<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sprit-Radar Pro | iOS 27 Spatial UI</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: '#0b0c10',
                        glassBg: 'rgba(255, 255, 255, 0.07)',
                        glassBorder: 'rgba(255, 255, 255, 0.12)',
                        accentBlue: '#007AFF',
                        accentGreen: '#34C759'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: radial-gradient(circle at top, #1c1d24 0%, #0b0c10 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-btn-active {
            background: #007AFF;
            box-shadow: 0 0 15px rgba(0, 122, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-white min-h-full pb-10 flex flex-col items-center justify-start p-4">

    <!-- Top Status / Header -->
    <div class="w-full max-w-md space-y-4">
        
        <!-- Live Badge Banner -->
        <div class="glass-card rounded-2xl p-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span id="statusIndicator" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="text-xs uppercase tracking-wider font-semibold text-emerald-400">Bester Live-Preis</span>
            </div>
            <div id="topPriceBadge" class="text-lg font-bold text-emerald-400">--- €</div>
        </div>

        <!-- App Header -->
        <div class="flex items-center justify-between px-1">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i data-lucide="fuel" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-bold tracking-tight">Sprit-Radar</h1>
                        <span class="text-[10px] font-extrabold bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">PRO</span>
                    </div>
                    <p class="text-xs text-gray-400">iOS 27 Spatial UI · GPS Ortung</p>
                </div>
            </div>
            <button onclick="toggleSettingsModal()" class="w-10 h-10 glass-btn rounded-full flex items-center justify-center text-gray-300 hover:text-white transition">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Fuel Type Selector Tab -->
        <div class="glass-card rounded-2xl p-1.5 flex justify-between space-x-1">
            <button onclick="selectFuelType('e5')" id="btn-e5" class="fuel-btn flex-1 py-2.5 rounded-xl font-medium text-xs text-center transition glass-btn-active">
                Super E5<br><span id="tab-price-e5" class="text-[10px] opacity-75">--- €</span>
            </button>
            <button onclick="selectFuelType('e10')" id="btn-e10" class="fuel-btn flex-1 py-2.5 rounded-xl font-medium text-xs text-center transition text-gray-400">
                Super E10<br><span id="tab-price-e10" class="text-[10px] opacity-75">--- €</span>
            </button>
            <button onclick="selectFuelType('diesel')" id="btn-diesel" class="fuel-btn flex-1 py-2.5 rounded-xl font-medium text-xs text-center transition text-gray-400">
                Diesel<br><span id="tab-price-diesel" class="text-[10px] opacity-75">--- €</span>
            </button>
        </div>

        <!-- Search Bar & Sorting -->
        <div class="flex space-x-2">
            <div class="glass-card rounded-xl px-3 py-2 flex items-center flex-1">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 mr-2"></i>
                <input type="text" id="searchInput" oninput="renderStations()" placeholder="Marke oder Straße suchen..." class="bg-transparent border-none text-xs text-white focus:outline-none w-full placeholder-gray-500">
            </div>
            <button onclick="toggleSort()" class="glass-card rounded-xl px-3 py-2 flex items-center text-xs text-gray-300 space-x-1">
                <span id="sortLabel">Preis</span>
                <i data-lucide="arrow-down-up" class="w-3.5 h-3.5 ml-1"></i>
            </button>
        </div>

        <!-- Station List Container -->
        <div id="stationList" class="space-y-3 pt-1">
            <!-- Loading State -->
            <div id="loadingState" class="glass-card rounded-2xl p-8 text-center space-y-3">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-blue-500 border-t-transparent"></div>
                <p class="text-xs text-gray-400">Lade Spritpreise...</p>
            </div>
        </div>

    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden items-end sm:items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 space-y-5 border border-white/20">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold">Einstellungen</h3>
                <button onclick="toggleSettingsModal()" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-3">
                <label class="text-xs text-gray-300 font-medium">Tankkönig API-Schlüssel</label>
                <input type="text" id="apiKeyInput" placeholder="00000000-0000-0000-0000-000000000000" class="w-full glass-card rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none border border-white/20">
                <p class="text-[10px] text-gray-400">Kostenlos erstellen auf <a href="https://creativecommons.tankkoenig.de/" target="_blank" class="text-blue-400 underline">tankkoenig.de</a></p>
            </div>

            <div class="space-y-3">
                <label class="text-xs text-gray-300 font-medium">Suchradius: <span id="radiusVal">5</span> km</label>
                <input type="range" id="radiusInput" min="1" max="25" value="5" oninput="document.getElementById('radiusVal').innerText = this.value" class="w-full accent-blue-500">
            </div>

            <div class="pt-2 space-y-2">
                <button onclick="saveSettings()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-semibold text-xs transition shadow-lg shadow-blue-600/30">
                    Einstellungen Speichern
                </button>
                <button onclick="loadDemoData()" class="w-full py-2.5 glass-btn rounded-xl text-xs text-gray-300 hover:text-white transition">
                    Demo-Daten laden
                </button>
            </div>
        </div>
    </div>

    <script>
        // Global App State
        let currentFuelType = 'e5';
        let sortBy = 'price'; // 'price' or 'dist'
        let stationsData = [];
        let userLat = 52.520008; // Default Berlin Demo
        let userLng = 13.404954;

        // Demo Fallback Data
        const demoStations = [
            { id: '1', name: 'Aral', brand: 'ARAL', street: 'Hauptstraße 12', houseNumber: '', postCode: 10115, place: 'Berlin', dist: 0.8, price: 1.729, e5: 1.729, e10: 1.669, diesel: 1.619, isOpen: true },
            { id: '2', name: 'Shell', brand: 'SHELL', street: 'Berliner Str. 45', houseNumber: '', postCode: 10117, place: 'Berlin', dist: 1.4, price: 1.749, e5: 1.749, e10: 1.689, diesel: 1.639, isOpen: true },
            { id: '3', name: 'JET', brand: 'JET', street: 'Leipziger Str. 88', houseNumber: '', postCode: 10117, place: 'Berlin', dist: 2.1, price: 1.699, e5: 1.699, e10: 1.639, diesel: 1.589, isOpen: true },
            { id: '4', name: 'TOTAL', brand: 'TOTAL', street: 'Potsdamer Platz 1', houseNumber: '', postCode: 10785, place: 'Berlin', dist: 3.5, price: 1.719, e5: 1.719, e10: 1.659, diesel: 1.609, isOpen: false }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadSettings();
            initApp();
        });

        function initApp() {
            const apiKey = localStorage.getItem('tankkoenig_apikey');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLng = pos.coords.longitude;
                        if (apiKey) { fetchLivePrices(apiKey); } else { loadDemoData(); }
                    },
                    (err) => {
                        console.warn('GPS Zugriff verweigert oder Fehler:', err);
                        if (apiKey) { fetchLivePrices(apiKey); } else { loadDemoData(); }
                    },
                    { timeout: 7000 }
                );
            } else {
                if (apiKey) { fetchLivePrices(apiKey); } else { loadDemoData(); }
            }
        }

        async function fetchLivePrices(apiKey) {
            const radius = localStorage.getItem('tankkoenig_radius') || 5;
            const url = `https://creativecommons.tankkoenig.de/json/list.php?lat=${userLat}&lng=${userLng}&rad=${radius}&sort=dist&type=all&apikey=${apiKey}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.ok && data.stations) {
                    stationsData = data.stations;
                    renderStations();
                } else {
                    alert('API-Fehler: ' + (data.message || 'Schlüssel ungültig. Lade Demo-Daten.'));
                    loadDemoData();
                }
            } catch (err) {
                console.error('Fetch error:', err);
                loadDemoData();
            }
        }

        function loadDemoData() {
            stationsData = demoStations;
            renderStations();
            toggleSettingsModal(false);
        }

        function renderStations() {
            const listEl = document.getElementById('stationList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            // Filter and Sort
            let filtered = stationsData.filter(s => {
                const nameMatch = (s.brand || s.name || '').toLowerCase().includes(searchVal);
                const streetMatch = (s.street || '').toLowerCase().includes(searchVal);
                return nameMatch || streetMatch;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'price') {
                    return (a[currentFuelType] || 99) - (b[currentFuelType] || 99);
                } else {
                    return a.dist - b.dist;
                }
            });

            // Update Tab Mini Prices
            if (filtered.length > 0) {
                const cheapest = [...filtered].sort((a,b) => (a[currentFuelType] || 99) - (b[currentFuelType] || 99))[0];
                document.getElementById('topPriceBadge').innerText = cheapest[currentFuelType] ? cheapest[currentFuelType].toFixed(3) + ' €' : '--- €';
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="glass-card rounded-2xl p-8 text-center text-gray-400 text-xs">
                        Keine Tankstellen in der Nähe gefunden.
                    </div>`;
                return;
            }

            listEl.innerHTML = filtered.map(s => {
                const price = s[currentFuelType];
                const priceStr = price ? price.toFixed(3) : '---';
                const mainPrice = priceStr.slice(0, -1);
                const subPrice = priceStr.slice(-1);
                const navUrl = `https://maps.apple.com/?daddr=${s.lat || userLat},${s.lng || userLng}`;

                return `
                    <div class="glass-card rounded-2xl p-4 flex items-center justify-between hover:border-white/30 transition">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-sm tracking-wide text-white">${s.brand || s.name}</span>
                                ${s.isOpen ? '<span class="text-[9px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded-full">Offen</span>' : '<span class="text-[9px] bg-red-500/20 text-red-400 px-1.5 py-0.5 rounded-full">Geschlossen</span>'}
                            </div>
                            <p class="text-xs text-gray-400">${s.street} ${s.houseNumber || ''}</p>
                            <div class="flex items-center text-[10px] text-gray-400 space-x-1 pt-1">
                                <i data-lucide="navigation" class="w-3 h-3 text-blue-400"></i>
                                <span>${s.dist.toFixed(1)} km entfernt</span>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="text-2xl font-extrabold text-white tracking-tight">
                                ${mainPrice}<span class="text-xs font-semibold align-top text-gray-300">${subPrice}</span> <span class="text-sm font-normal text-gray-400">€</span>
                            </div>
                            <a href="${navUrl}" target="_blank" class="mt-2 glass-btn px-3 py-1.5 rounded-xl text-[10px] font-medium text-blue-400 flex items-center space-x-1 hover:bg-white/10 transition">
                                <span>Route</span>
                                <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function selectFuelType(type) {
            currentFuelType = type;
            document.querySelectorAll('.fuel-btn').forEach(btn => btn.classList.remove('glass-btn-active', 'text-white'));
            document.querySelectorAll('.fuel-btn').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById('btn-' + type);
            activeBtn.classList.add('glass-btn-active', 'text-white');
            activeBtn.classList.remove('text-gray-400');
            
            renderStations();
        }

        function toggleSort() {
            sortBy = sortBy === 'price' ? 'dist' : 'price';
            document.getElementById('sortLabel').innerText = sortBy === 'price' ? 'Preis' : 'Distanz';
            renderStations();
        }

        function toggleSettingsModal(show = true) {
            const modal = document.getElementById('settingsModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const rad = document.getElementById('radiusInput').value;
            
            if (key) localStorage.setItem('tankkoenig_apikey', key);
            localStorage.setItem('tankkoenig_radius', rad);
            
            toggleSettingsModal(false);
            initApp();
        }

        function loadSettings() {
            const key = localStorage.getItem('tankkoenig_apikey');
            const rad = localStorage.getItem('tankkoenig_radius');
            if (key) document.getElementById('apiKeyInput').value = key;
            if (rad) {
                document.getElementById('radiusInput').value = rad;
                document.getElementById('radiusVal').innerText = rad;
            }
        }
    </script>
</body>
</html>
