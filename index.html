<!DOCTYPE html>
<html lang="de" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sprit-Radar Pro | iOS Spatial UI</title>
    
    <!-- PWA / Apple Home Screen Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sprit-Radar">
    <link rel="apple-touch-icon" href="https://img.icons8.com/isometric-line/512/gas-station.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iosBg: '#08080a',
                        glassBg: 'rgba(255, 255, 255, 0.06)',
                        glassBorder: 'rgba(255, 255, 255, 0.12)',
                        accentBlue: '#007AFF',
                        accentGreen: '#34C759'
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background: radial-gradient(circle at top, #181920 0%, #08080a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-btn-active {
            background: #007AFF;
            box-shadow: 0 0 20px rgba(0, 122, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        /* Dynamic Island Smooth Animations */
        .dynamic-island {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
    </style>
</head>
<body class="text-white min-h-full pb-12 flex flex-col items-center justify-start p-4 pt-8">

    <div class="w-full max-w-md space-y-4">
        
        <!-- Virtual Dynamic Island (Simulated Spatial Element) -->
        <div id="dynamicIsland" class="dynamic-island mx-auto bg-black/90 border border-white/20 rounded-[28px] p-2.5 px-4 flex items-center justify-between shadow-2xl backdrop-blur-xl w-[92%]">
            <div class="flex items-center space-x-2.5 overflow-hidden">
                <span id="islandStatusDot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse flex-shrink-0"></span>
                <span id="islandTitle" class="text-xs font-semibold tracking-wide text-gray-200 truncate">Sprit-Radar Radar Bereit</span>
            </div>
            <div class="flex items-center space-x-2">
                <span id="islandPrice" class="text-xs font-black text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">--- €</span>
            </div>
        </div>

        <!-- App Header -->
        <div class="flex items-center justify-between px-1 pt-1">
            <div class="flex items-center space-x-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-blue-500/30 border border-white/20">
                    <i data-lucide="fuel" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-xl font-extrabold tracking-tight">Sprit-Radar</h1>
                        <span class="text-[10px] font-black bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded-full border border-blue-500/30">PRO</span>
                    </div>
                    <p id="locationSubtext" class="text-xs text-gray-400 truncate max-w-[200px]">iOS Spatial UI · GPS Aktiv</p>
                </div>
            </div>
            <button onclick="toggleSettingsModal(true)" class="w-10 h-10 glass-btn rounded-2xl flex items-center justify-center text-gray-300 hover:text-white transition active:scale-95">
                <i data-lucide="sliders-horizontal" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Location & Address Search Bar -->
        <div class="flex space-x-2">
            <div class="glass-card rounded-2xl px-3.5 py-2.5 flex items-center flex-1">
                <i data-lucide="map-pin" class="w-4 h-4 text-blue-400 mr-2.5 flex-shrink-0"></i>
                <input type="text" id="citySearchInput" placeholder="Ort, PLZ oder Straße eingeben..." class="bg-transparent border-none text-xs text-white focus:outline-none w-full placeholder-gray-500" onkeypress="if(event.key === 'Enter') searchLocation()">
            </div>
            <button onclick="searchLocation()" class="glass-card rounded-2xl px-3.5 py-2.5 flex items-center text-xs text-blue-400 font-semibold space-x-1 hover:bg-white/10 transition active:scale-95">
                <span>Suchen</span>
            </button>
            <button onclick="useGPS()" class="glass-card rounded-2xl px-3 py-2.5 flex items-center text-xs text-gray-300 hover:text-white transition active:scale-95" title="GPS verwenden">
                <i data-lucide="locate" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Fuel Type Selector Tab -->
        <div class="glass-card rounded-2xl p-1.5 flex justify-between space-x-1">
            <button onclick="selectFuelType('e5')" id="btn-e5" class="fuel-btn flex-1 py-2.5 rounded-xl font-bold text-xs text-center transition glass-btn-active">
                Super E5
            </button>
            <button onclick="selectFuelType('e10')" id="btn-e10" class="fuel-btn flex-1 py-2.5 rounded-xl font-bold text-xs text-center transition text-gray-400">
                Super E10
            </button>
            <button onclick="selectFuelType('diesel')" id="btn-diesel" class="fuel-btn flex-1 py-2.5 rounded-xl font-bold text-xs text-center transition text-gray-400">
                Diesel
            </button>
        </div>

        <!-- Filter & Sort Bar -->
        <div class="flex space-x-2">
            <div class="glass-card rounded-2xl px-3.5 py-2 flex items-center flex-1">
                <i data-lucide="search" class="w-4 h-4 text-gray-400 mr-2"></i>
                <input type="text" id="searchInput" oninput="renderStations()" placeholder="Marke filtern (z.B. Aral)..." class="bg-transparent border-none text-xs text-white focus:outline-none w-full placeholder-gray-500">
            </div>
            <button onclick="toggleSort()" class="glass-card rounded-2xl px-3.5 py-2 flex items-center text-xs text-gray-300 space-x-1 hover:bg-white/10 transition">
                <span id="sortLabel" class="font-medium">Preis</span>
                <i data-lucide="arrow-down-up" class="w-3.5 h-3.5 ml-1 text-blue-400"></i>
            </button>
        </div>

        <!-- Station List Container -->
        <div id="stationList" class="space-y-3 pt-1">
            <div id="loadingState" class="glass-card rounded-3xl p-8 text-center space-y-3">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-blue-500 border-t-transparent"></div>
                <p class="text-xs text-gray-400">Lade Tankstellen & Preise...</p>
            </div>
        </div>

    </div>

    <!-- Settings & Widgets Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-xl hidden items-end sm:items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-md rounded-[32px] p-6 space-y-5 border border-white/20">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-blue-400"></i>
                    <h3 class="text-lg font-bold">Einstellungen & Widgets</h3>
                </div>
                <button onclick="toggleSettingsModal(false)" class="text-gray-400 hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div class="space-y-2">
                <label class="text-xs text-gray-300 font-medium">Tankkönig API-Schlüssel</label>
                <input type="text" id="apiKeyInput" placeholder="00000000-0000-0000-0000-000000000000" class="w-full glass-card rounded-2xl px-3.5 py-2.5 text-xs text-white focus:outline-none border border-white/20">
                <p class="text-[10px] text-gray-400">Kostenlos registrieren auf <a href="https://creativecommons.tankkoenig.de/" target="_blank" class="text-blue-400 underline">tankkoenig.de</a></p>
            </div>

            <div class="space-y-2">
                <label class="text-xs text-gray-300 font-medium">Suchradius: <span id="radiusVal" class="text-blue-400 font-bold">5</span> km</label>
                <input type="range" id="radiusInput" min="1" max="25" value="5" oninput="document.getElementById('radiusVal').innerText = this.value" class="w-full accent-blue-500">
            </div>

            <div class="pt-2 space-y-2.5">
                <button onclick="saveSettings()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-2xl font-bold text-xs transition shadow-lg shadow-blue-600/40 active:scale-95">
                    Einstellungen Speichern
                </button>
                <button onclick="copyWidgetData()" class="w-full py-2.5 glass-btn rounded-2xl text-xs font-semibold text-emerald-400 hover:text-emerald-300 transition flex items-center justify-center space-x-2 active:scale-95">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                    <span>Widget & Sperrbildschirm Daten kopieren</span>
                </button>
                <button onclick="loadDemoData()" class="w-full py-2 glass-btn rounded-2xl text-xs text-gray-400 hover:text-white transition">
                    Demo-Daten Modus
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentFuelType = 'e5';
        let sortBy = 'price';
        let stationsData = [];
        let userLat = 52.520008;
        let userLng = 13.404954;
        let currentCityName = 'Berlin (Demo)';

        const demoStations = [
            { id: '1', name: 'Aral', brand: 'ARAL', street: 'Hauptstraße 12', houseNumber: '', postCode: 10115, place: 'Berlin', dist: 0.8, price: 1.729, e5: 1.729, e10: 1.669, diesel: 1.619, isOpen: true },
            { id: '2', name: 'Shell', brand: 'SHELL', street: 'Berliner Str. 45', houseNumber: '', postCode: 10117, place: 'Berlin', dist: 1.4, price: 1.749, e5: 1.749, e10: 1.689, diesel: 1.639, isOpen: true },
            { id: '3', name: 'JET', brand: 'JET', street: 'Leipziger Str. 88', houseNumber: '', postCode: 10117, place: 'Berlin', dist: 2.1, price: 1.699, e5: 1.699, e10: 1.639, diesel: 1.589, isOpen: true },
            { id: '4', name: 'TOTAL', brand: 'TOTAL', street: 'Potsdamer Platz 1', houseNumber: '', postCode: 10785, place: 'Berlin', dist: 3.5, price: 1.719, e5: 1.719, e10: 1.659, diesel: 1.609, isOpen: false }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadSettings();
            useGPS();
        });

        function updateDynamicIsland(text, price) {
            const islandTitle = document.getElementById('islandTitle');
            const islandPrice = document.getElementById('islandPrice');
            islandTitle.innerText = text;
            if (price) islandPrice.innerText = price;
        }

        function useGPS() {
            updateDynamicIsland('Starte GPS Ortung...', '--- €');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        userLat = pos.coords.latitude;
                        userLng = pos.coords.longitude;
                        currentCityName = 'GPS Standort';
                        document.getElementById('locationSubtext').innerText = 'Ort: Aktueller Standort';
                        initFetch();
                    },
                    (err) => {
                        document.getElementById('locationSubtext').innerText = 'GPS nicht verfügbar';
                        initFetch();
                    },
                    { timeout: 5000 }
                );
            } else {
                initFetch();
            }
        }

        async function searchLocation() {
            const query = document.getElementById('citySearchInput').value.trim();
            if (!query) return;

            updateDynamicIsland('Suche Adresse...', '--- €');
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=de,at,ch&limit=1`);
                const data = await res.json();
                
                if (data && data.length > 0) {
                    userLat = parseFloat(data[0].lat);
                    userLng = parseFloat(data[0].lon);
                    const parts = data[0].display_name.split(',');
                    currentCityName = parts[0] + (parts[1] ? ', ' + parts[1] : '');
                    document.getElementById('locationSubtext').innerText = 'Ort: ' + currentCityName;
                    initFetch();
                } else {
                    alert('Adresse oder Ort konnte nicht gefunden werden.');
                    updateDynamicIsland('Ort nicht gefunden', '--- €');
                }
            } catch (err) {
                alert('Fehler bei der Ortssuche.');
            }
        }

        function initFetch() {
            const apiKey = localStorage.getItem('tankkoenig_apikey');
            if (apiKey) {
                fetchLivePrices(apiKey);
            } else {
                loadDemoData();
            }
        }

        async function fetchLivePrices(apiKey) {
            const radius = localStorage.getItem('tankkoenig_radius') || 5;
            const url = `https://creativecommons.tankkoenig.de/json/list.php?lat=${userLat}&lng=${userLng}&rad=${radius}&sort=dist&type=all&apikey=${apiKey}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.ok && data.stations) {
                    stationsData = data.stations;
                    renderStations();
                } else {
                    alert('Tankkönig API-Fehler: Schlüssel prüfen!');
                    loadDemoData();
                }
            } catch (err) {
                loadDemoData();
            }
        }

        function loadDemoData() {
            stationsData = demoStations;
            renderStations();
            toggleSettingsModal(false);
        }

        function renderStations() {
            const listEl = document.getElementById('stationList');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = stationsData.filter(s => {
                const nameMatch = (s.brand || s.name || '').toLowerCase().includes(searchVal);
                const streetMatch = (s.street || '').toLowerCase().includes(searchVal);
                return nameMatch || streetMatch;
            });

            filtered.sort((a, b) => {
                if (sortBy === 'price') {
                    return (a[currentFuelType] || 99) - (b[currentFuelType] || 99);
                } else {
                    return a.dist - b.dist;
                }
            });

            if (filtered.length > 0) {
                const cheapest = [...filtered].sort((a,b) => (a[currentFuelType] || 99) - (b[currentFuelType] || 99))[0];
                const priceVal = cheapest[currentFuelType] ? cheapest[currentFuelType].toFixed(3) + ' €' : '--- €';
                updateDynamicIsland(`Bester Preis: ${cheapest.brand || cheapest.name}`, priceVal);
            }

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="glass-card rounded-3xl p-8 text-center text-gray-400 text-xs">
                        Keine Tankstellen in diesem Radius gefunden.
                    </div>`;
                return;
            }

            listEl.innerHTML = filtered.map(s => {
                const price = s[currentFuelType];
                const priceStr = price ? price.toFixed(3) : '---';
                const mainPrice = priceStr.slice(0, -1);
                const subPrice = priceStr.slice(-1);
                const navUrl = `https://maps.apple.com/?daddr=${s.lat || userLat},${s.lng || userLng}`;

                return `
                    <div class="glass-card rounded-3xl p-4.5 flex items-center justify-between hover:border-white/30 transition">
                        <div class="space-y-1">
                            <div class="flex items-center space-x-2">
                                <span class="font-black text-sm tracking-wide text-white">${s.brand || s.name}</span>
                                ${s.isOpen ? '<span class="text-[9px] font-bold bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full border border-emerald-500/30">Offen</span>' : '<span class="text-[9px] font-bold bg-red-500/20 text-red-400 px-2 py-0.5 rounded-full border border-red-500/30">Zu</span>'}
                            </div>
                            <p class="text-xs text-gray-400">${s.street} ${s.houseNumber || ''}</p>
                            <div class="flex items-center text-[10px] text-gray-400 space-x-1 pt-1">
                                <i data-lucide="navigation" class="w-3 h-3 text-blue-400"></i>
                                <span>${s.dist.toFixed(1)} km entfernt</span>
                            </div>
                        </div>
                        <div class="text-right flex flex-col items-end">
                            <div class="text-2xl font-black text-white tracking-tight">
                                ${mainPrice}<span class="text-xs font-bold align-top text-gray-300">${subPrice}</span> <span class="text-sm font-normal text-gray-400">€</span>
                            </div>
                            <a href="${navUrl}" target="_blank" class="mt-2 glass-btn px-3 py-1.5 rounded-xl text-[10px] font-bold text-blue-400 flex items-center space-x-1 hover:bg-white/10 transition active:scale-95">
                                <span>Route</span>
                                <i data-lucide="chevron-right" class="w-3 h-3"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');

            lucide.createIcons();
        }

        function selectFuelType(type) {
            currentFuelType = type;
            document.querySelectorAll('.fuel-btn').forEach(btn => btn.classList.remove('glass-btn-active', 'text-white'));
            document.querySelectorAll('.fuel-btn').forEach(btn => btn.classList.add('text-gray-400'));
            
            const activeBtn = document.getElementById('btn-' + type);
            activeBtn.classList.add('glass-btn-active', 'text-white');
            activeBtn.classList.remove('text-gray-400');
            
            renderStations();
        }

        function toggleSort() {
            sortBy = sortBy === 'price' ? 'dist' : 'price';
            document.getElementById('sortLabel').innerText = sortBy === 'price' ? 'Preis' : 'Distanz';
            renderStations();
        }

        function toggleSettingsModal(show = true) {
            const modal = document.getElementById('settingsModal');
            modal.style.display = show ? 'flex' : 'none';
        }

        function saveSettings() {
            const key = document.getElementById('apiKeyInput').value.trim();
            const rad = document.getElementById('radiusInput').value;
            
            if (key) localStorage.setItem('tankkoenig_apikey', key);
            localStorage.setItem('tankkoenig_radius', rad);
            
            toggleSettingsModal(false);
            initFetch();
        }

        function loadSettings() {
            const key = localStorage.getItem('tankkoenig_apikey');
            const rad = localStorage.getItem('tankkoenig_radius');
            if (key) document.getElementById('apiKeyInput').value = key;
            if (rad) {
                document.getElementById('radiusInput').value = rad;
                document.getElementById('radiusVal').innerText = rad;
            }
        }

        function copyWidgetData() {
            if (stationsData.length === 0) return alert('Keine Daten verfügbar.');
            const cheapest = [...stationsData].sort((a,b) => (a[currentFuelType] || 99) - (b[currentFuelType] || 99))[0];
            const text = `${cheapest.brand}: ${cheapest[currentFuelType].toFixed(3)}€ (${cheapest.dist.toFixed(1)}km)`;
            navigator.clipboard.writeText(text);
            alert('Widget-Daten in Zwischenablage kopiert:\n' + text);
        }
    </script>
</body>
</html>
